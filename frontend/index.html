<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | Jazz Barbers Eastbourne</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #111;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 40px;
            border: 1px solid #333;
            border-radius: 8px;
            background-color: #1a1a1a;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 5px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #f1c40f; /* Gold accent color for barbershop vibe */
        }
        .subtitle {
            font-size: 1.1rem;
            color: #aaa;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .coming-soon {
            font-size: 1.8rem;
            font-weight: 300;
            margin-bottom: 40px;
        }
        .contact {
            margin-top: 30px;
            font-size: 0.95rem;
            color: #888;
        }
        .email {
            color: #f1c40f;
            text-decoration: none;
            font-weight: bold;
        }
        .email:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Jazz Barbers</h1>
        <div class="subtitle">Eastbourne</div>
        
        <div class="coming-soon">
            Our new website is <strong>Coming Soon</strong>
        </div>
        
        <div class="contact">
            For inquiries, please contact us at:<br>
            <a href="mailto:jazzcouk@gmail.com" class="email">jazzcouk@gmail.com</a>
        </div>
    </div>
</body>
</html>
