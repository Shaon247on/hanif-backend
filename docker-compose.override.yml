# =============================================================================
# Docker Compose — Local override (loaded automatically by `docker compose up`)
# =============================================================================
# Points the containers at the compose Postgres/Redis services. `environment`
# takes precedence over `.env`, which keeps its host-side (SQLite) defaults.

x-local-env: &local-env
  DATABASE_URL: postgres://postgres:postgres@db:5432/django_db
  CELERY_BROKER_URL: redis://redis:6379/0
  REDIS_URL: redis://redis:6379/1

services:
  web:
    command: sh -c "python manage.py migrate --no-input && python manage.py runserver 0.0.0.0:8000"
    environment: *local-env
    restart: unless-stopped

  celery-worker:
    environment: *local-env
    restart: unless-stopped
    healthcheck:
      disable: true

  celery-beat:
    environment: *local-env
    # Beat exits until `web` has created the django_celery_beat tables
    restart: unless-stopped
    healthcheck:
      disable: true
